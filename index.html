<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Přehled rankingu závodníků</title>
  <link rel="stylesheet" href="css/style.css?v=21" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div>
        <h1>Přehled rankingu závodníků</h1>
        <p class="subtitle">Závody OB v rozmezí měsíc zpět až měsíc dopředu · podklady pro výpočet rankingu</p>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="toolbar">
      <input
        id="searchInput"
        class="search-input"
        type="search"
        placeholder="Filtrovat podle názvu, oblasti, sportu..."
      />
      <label class="checkbox-label">
        <input id="onlyRankingCheckbox" type="checkbox" checked />
        Pouze rankingové závody
      </label>
      <select id="rankingTypeFilter" class="select-input" aria-label="Typ rankingu">
        <option value="all">Všechny typy rankingu</option>
        <option value="les">Les</option>
        <option value="sprint">Sprint</option>
      </select>
      <span id="statusText" class="status-text">Načítám závody...</span>
    </div>

    <div class="table-wrap">
      <table class="events-table">
        <thead>
          <tr>
            <th>Datum</th>
            <th>ID</th>
            <th>Název závodu</th>
            <th>Poř.</th>
            <th>Oblast</th>
            <th>Sport</th>
            <th>Dis.</th>
            <th>Ranking</th>
          </tr>
        </thead>
        <tbody id="eventsBody">
          <tr>
            <td colspan="8" class="empty-cell">Načítám závody...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <script type="module" src="js/app.js?v=21"></script>
</body>
</html>
