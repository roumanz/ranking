<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ORIS Ranking</title>
  <link rel="stylesheet" href="css/style.css?v=11" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1>ORIS Ranking</h1>
      <p class="subtitle">Závody v rozmezí měsíc zpět až měsíc dopředu</p>
    </div>
  </header>

  <main class="container">
    <div class="toolbar">
      <input
        id="searchInput"
        class="search-input"
        type="search"
        placeholder="Filtrovat podle názvu, klubu nebo regionu..."
      />
      <span id="statusText" class="status-text">Načítám závody...</span>
    </div>

    <div class="table-wrap">
      <table class="events-table">
        <thead>
          <tr>
            <th>Datum</th>
            <th>ID</th>
            <th>Název závodu</th>
            <th>Pořadatelé</th>
            <th>Region</th>
          </tr>
        </thead>
        <tbody id="eventsBody">
          <tr>
            <td colspan="5" class="empty-cell">Načítám závody...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <script type="module" src="js/app.js?v=11"></script>
</body>
</html>
